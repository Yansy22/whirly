<!DOCTYPE html>
<html lang="en">
<!--  MINI-SHOP TEMPLATE · customer site (Supabase).
      Edit ONLY the BRAND block. Files: index.html + admin.html  -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light" />
<title id="pageTitle">Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme: light;
    --night:#E2DDDA; --surface:#ECE8E3; --moon:#221D1A; --muted:#7A6C64;
    --line:#7A1A28; --aqua:#7A1A28; --aqua2:#9B2233; --silver:#8A7A72; --r:16px;
    --hairline: rgba(122,26,40,.22);
    --frame: rgba(122,26,40,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--night);color:var(--moon);font-family:"Jost",system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
  img{display:block}
  .wrap{max-width:1020px;margin:0 auto;padding:0 26px;position:relative}
  .eyebrow{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--aqua);font-weight:400}

  /* top bar — logo only, no duplicate wordmark */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:26px 0 14px}
  .brandmark{display:flex;align-items:center;text-decoration:none;color:var(--moon)}
  .brandmark img{height:46px;width:auto}
  .brandmark span{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;letter-spacing:.02em}
  .ig-link{font-size:12px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--hairline);border-radius:999px;padding:8px 18px;text-decoration:none;transition:.25s}
  .ig-link:hover,.ig-link:focus-visible{color:#fff;background:var(--aqua);border-color:var(--aqua)}

  /* hero — airy, no glow box */
  .hero{position:relative;padding:58px 0 46px;text-align:center}
  .hero-logo{display:flex;justify-content:center;margin-bottom:26px}
  .hero-logo img{height:150px;width:auto}
  .hero .eyebrow{margin-bottom:24px;display:inline-block}
  .hero h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,9vw,74px);line-height:1.05;letter-spacing:.005em;margin-bottom:22px}
  .hero h1 em{font-style:italic;color:var(--aqua)}
  .hero .lede{max-width:46ch;margin:0 auto 30px;color:var(--muted);font-size:clamp(15px,3.6vw,17px)}
  .hero-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px}
  .hero-meta span{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
  .star{color:var(--aqua);font-size:11px}

  /* category nav — uniform elegant tiles */
  .cat-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 12px;padding:34px 0 38px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);margin-top:44px}
  .cat-tile{flex:0 0 auto;min-width:132px;text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16.5px;letter-spacing:.03em;color:var(--aqua);text-decoration:none;border:1px solid rgba(122,26,40,.4);border-radius:999px;padding:11px 20px;transition:.25s;background:transparent}
  .cat-tile:hover,.cat-tile:focus-visible{background:var(--aqua);color:#F6EFE6;border-color:var(--aqua)}

  .cat-block{padding:46px 0 10px}
  .cat-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;gap:16px}
  .cat-head h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:33px;letter-spacing:.01em}
  .cat-blurb{color:var(--muted);font-size:14px;margin-bottom:22px}
  .view-all{font-size:12px;letter-spacing:.1em;color:var(--aqua);text-decoration:none;white-space:nowrap;border-bottom:1px solid transparent;transition:.2s}
  .view-all:hover,.view-all:focus-visible{border-color:var(--aqua)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 18px}
  @media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:30px 22px}}
  .grid.full{padding-bottom:26px}
  @media(min-width:760px){.grid.full{grid-template-columns:repeat(3,1fr);gap:34px 24px}}
  .card{display:flex;flex-direction:column;text-decoration:none;color:inherit;cursor:pointer}
  .card:focus-visible{outline:1px solid var(--aqua);outline-offset:6px;border-radius:6px}

  /* thumbs — no maroon border; soft shadow instead */
  .thumb{position:relative;aspect-ratio:4/5;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(34,29,26,.10), 0 6px 18px -8px rgba(34,29,26,.12);transition:transform .3s, box-shadow .3s}
  .thumb img{width:100%;height:100%;object-fit:cover}
  @media(hover:hover){.card:hover .thumb{transform:translateY(-3px);box-shadow:0 2px 4px rgba(34,29,26,.10), 0 14px 30px -10px rgba(122,26,40,.28)}}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface);font-family:"Cormorant Garamond",serif;font-size:42px;color:var(--aqua)}
  .c-tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17.5px;color:var(--aqua);margin:14px 0 2px;line-height:1.25}
  .c-name{font-family:"Jost",sans-serif;font-weight:300;font-size:12.5px;letter-spacing:.04em;color:var(--muted)}

  #category,#detail{display:none}
  .back{display:inline-flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font-family:"Jost",sans-serif;font-weight:300;font-size:12px;letter-spacing:.08em;color:var(--muted);padding:28px 0 12px;transition:.2s;text-decoration:none}
  .back:hover,.back:focus-visible{color:var(--aqua)}
  .cat-title{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(30px,7vw,44px);padding:6px 0 4px}
  .cat-sub{color:var(--muted);font-size:14px;padding-bottom:26px}

  .detail-grid{display:grid;gap:34px;padding-bottom:80px}
  @media(min-width:800px){.detail-grid{grid-template-columns:1fr 1fr;gap:56px;align-items:start}}
  .detail-media{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:0 2px 6px rgba(34,29,26,.12), 0 16px 40px -14px rgba(34,29,26,.18)}
  .detail-media img{width:100%;height:100%;object-fit:cover}
  .detail-info{padding-top:6px}
  .detail-info .eyebrow{margin-bottom:14px}
  .detail-tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;font-size:clamp(30px,6.5vw,46px);line-height:1.08;color:var(--moon);margin-bottom:6px}
  .detail-name{font-family:"Jost",sans-serif;font-weight:300;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .detail-spec{font-size:13px;letter-spacing:.03em;color:var(--muted);margin-bottom:22px}
  .detail-rule{height:1px;background:linear-gradient(90deg,var(--hairline),transparent);margin:20px 0 24px}
  .detail-desc{color:#4A403B;white-space:pre-line;margin-bottom:34px;font-size:16px}
  .order{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--aqua);color:#F6EFE6;font-family:"Jost",sans-serif;font-weight:500;font-size:14px;letter-spacing:.05em;border:none;border-radius:999px;padding:17px 24px;cursor:pointer;text-decoration:none;transition:background .2s,transform .15s;box-shadow:0 8px 20px -8px rgba(122,26,40,.45)}
  .order:hover{background:var(--aqua2)} .order:active{transform:scale(.985)}
  .order-note{font-size:12px;letter-spacing:.03em;color:var(--muted);margin-top:14px;text-align:center}

  .studio{border-top:1px solid var(--hairline);margin-top:44px;padding:48px 0 10px;display:grid;gap:24px}
  @media(min-width:720px){.studio{grid-template-columns:200px 1fr;gap:52px}}
  .studio h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:27px}
  .studio p{color:#4A403B;max-width:60ch;margin-bottom:14px}
  .shipping{font-size:12px;letter-spacing:.05em;color:var(--muted);display:inline-flex;align-items:center;gap:9px}

  .qr-box{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:26px}
  .qr-box img{width:128px;height:auto;border-radius:12px;background:#fff;padding:10px;box-shadow:0 2px 8px rgba(34,29,26,.12)}
  .qr-box span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  .state{padding:60px 0;text-align:center;color:var(--muted);font-size:14px;letter-spacing:.04em}
  footer{border-top:1px solid var(--hairline);margin-top:46px;padding:28px 0 56px;font-size:12px;letter-spacing:.04em;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  /* deep-maroon outer frame (owner request) — single refined line */
  .page-frame{position:fixed;inset:16px;border:1px solid var(--frame);border-radius:4px;pointer-events:none;z-index:1}
  @media(max-width:640px){.page-frame{inset:9px}}

  /* ---- prices ---- */
  .c-price{font-family:"Jost",sans-serif;font-weight:400;font-size:13px;color:var(--moon);margin-top:3px}
  .detail-price{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--moon);margin-bottom:20px}

  /* ---- cart button in topbar ---- */
  .cart-link{position:relative;font-size:12px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--hairline);border-radius:999px;padding:8px 16px;text-decoration:none;transition:.25s;margin-left:10px;cursor:pointer;background:none;font-family:inherit}
  .cart-link:hover{color:#fff;background:var(--aqua);border-color:var(--aqua)}
  .cart-count{display:inline-block;min-width:18px;text-align:center;background:var(--aqua);color:#fff;border-radius:999px;font-size:11px;padding:0 5px;margin-left:4px}
  .topbar-right{display:flex;align-items:center}

  /* ---- quantity stepper ---- */
  .qty{display:inline-flex;align-items:center;border:1px solid var(--hairline);border-radius:999px;overflow:hidden}
  .qty button{width:38px;height:38px;border:none;background:transparent;color:var(--aqua);font-size:18px;cursor:pointer}
  .qty button:hover{background:rgba(122,26,40,.08)}
  .qty span{min-width:34px;text-align:center;font-size:15px}
  .add-row{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .ask-link{display:block;text-align:center;font-size:12px;color:var(--muted);text-decoration:underline;margin-top:4px}

  /* ---- cart / checkout shared ---- */
  #cart,#checkout,#orderdone{display:none}
  .page-h{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(28px,6vw,40px);padding:6px 0 20px}
  .cart-row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:12px;margin-bottom:12px}
  .cart-row img,.cart-row .ph{width:60px;height:75px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface2)}
  .cart-row .ph{display:flex;align-items:center;justify-content:center;color:var(--aqua);font-family:"Cormorant Garamond",serif;font-size:26px}
  .cart-info{flex:1;min-width:0}
  .cart-info .t{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px;color:var(--aqua)}
  .cart-info .pr{font-size:13px;color:var(--muted)}
  .cart-remove{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
  .cart-remove:hover{color:var(--aqua)}
  .summary{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:16px;margin:8px 0 20px}
  .summary .line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
  .summary .total{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--moon);border-top:1px solid var(--hairline);margin-top:8px;padding-top:10px}
  .cta{display:block;width:100%;text-align:center;background:var(--aqua);color:#F6EFE6;font-weight:500;font-size:14px;letter-spacing:.05em;border:none;border-radius:999px;padding:16px;cursor:pointer;text-decoration:none;transition:background .2s;box-shadow:0 8px 20px -8px rgba(122,26,40,.45)}
  .cta:hover{background:var(--aqua2)} .cta:disabled{opacity:.5;cursor:not-allowed}
  .empty{padding:50px 0;text-align:center;color:var(--muted)}

  /* ---- checkout form ---- */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--aqua);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:10px;color:var(--moon);font-family:inherit;font-size:15px;padding:12px 14px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--aqua)}
  .field textarea{min-height:70px;resize:vertical}
  .paybox{background:rgba(122,26,40,.05);border:1px solid var(--hairline);border-radius:var(--r);padding:16px;margin:8px 0 18px}
  .paybox h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:19px;margin-bottom:8px}
  .paybox .kv{font-size:14px;margin:3px 0}
  .paybox .kv b{color:var(--aqua)}
  .paybox p{font-size:13px;color:var(--muted);margin-top:10px}
  .form-msg{padding:11px 14px;border-radius:10px;font-size:13px;margin:10px 0;display:none}
  .form-msg.err{background:rgba(179,58,80,.10);color:#B33A50;display:block}
  .checkmark{font-size:52px;color:var(--aqua);text-align:center;margin:30px 0 10px}

  /* ---- category page: denser, calmer grid ---- */
  .grid.full{grid-template-columns:repeat(2,1fr);gap:26px 16px;padding-bottom:26px}
  @media(min-width:620px){.grid.full{grid-template-columns:repeat(3,1fr);gap:30px 20px}}
  @media(min-width:920px){.grid.full{grid-template-columns:repeat(4,1fr);gap:34px 22px}}
  /* portrait but not overwhelming */
  .grid.full .thumb{aspect-ratio:3/4}

  /* ---- breadcrumb + page head ---- */
  .crumb{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:26px 0 0}
  .crumb a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:.2s}
  .crumb a:hover{color:var(--aqua);border-color:var(--aqua)}
  .crumb .sep{opacity:.45}
  .crumb .here{color:var(--aqua)}
  .cat-head-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--hairline);padding-bottom:18px;margin-bottom:28px}
  .cat-count{font-size:12px;letter-spacing:.1em;color:var(--muted);white-space:nowrap}

  /* ---- sibling category switcher (bottom of category page) ---- */
  .sibling{border-top:1px solid var(--hairline);margin-top:10px;padding:30px 0 60px}
  .sibling-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .sibling-row{display:flex;flex-wrap:wrap;gap:10px}
  .sibling-row a{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;color:var(--aqua);text-decoration:none;border:1px solid rgba(122,26,40,.32);border-radius:999px;padding:9px 17px;transition:.22s}
  .sibling-row a:hover{background:var(--aqua);color:#F6EFE6;border-color:var(--aqua)}

  /* ---- page transition (soft, respects reduced-motion) ---- */
  .view{animation:viewIn .32s ease both}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.view{animation:none}}

  /* ---- floating cart button (bottom-right) ---- */
  .cart-fab{position:fixed;right:22px;bottom:22px;z-index:5;display:none;align-items:center;gap:10px;
    background:var(--aqua);color:#F6EFE6;border:none;border-radius:999px;padding:14px 20px;cursor:pointer;
    font-family:"Jost",sans-serif;font-weight:500;font-size:14px;letter-spacing:.04em;text-decoration:none;
    box-shadow:0 10px 28px -8px rgba(122,26,40,.55);transition:transform .18s, background .2s}
  .cart-fab:hover{background:var(--aqua2);transform:translateY(-2px)}
  .cart-fab.show{display:inline-flex}
  .cart-fab .fab-count{background:#F6EFE6;color:var(--aqua);border-radius:999px;min-width:22px;height:22px;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:0 6px}
  .cart-fab .fab-total{font-size:12px;opacity:.9;border-left:1px solid rgba(246,239,230,.35);padding-left:10px}
  @media(max-width:640px){.cart-fab{right:14px;bottom:14px;padding:12px 16px}}

  /* ---- out of stock ---- */
  .oos-badge{position:absolute;top:10px;left:10px;background:rgba(34,29,26,.78);color:#F6EFE6;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 11px;border-radius:999px;z-index:2}
  .thumb.oos img{filter:grayscale(.6);opacity:.72}
  .order.disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;box-shadow:none}

  /* ---- homepage category grid (cover photos) ---- */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:34px 0 20px}
  @media(min-width:760px){.cat-grid{grid-template-columns:repeat(3,1fr);gap:20px}}
  .cat-card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(34,29,26,.10), 0 6px 18px -8px rgba(34,29,26,.12);transition:transform .3s, box-shadow .3s}
  @media(hover:hover){.cat-card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(34,29,26,.10), 0 14px 30px -10px rgba(122,26,40,.28)}}
  .cat-card .cc-media{aspect-ratio:1/1;background:var(--surface);position:relative}
  .cat-card .cc-media img{width:100%;height:100%;object-fit:cover}
  .cat-card .cc-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:40px;color:var(--aqua)}
  .cat-card .cc-name{background:#FBFAF8;padding:13px 10px;text-align:center;font-family:"Cormorant Garamond",serif;font-size:17px;letter-spacing:.02em;color:var(--moon)}
</style>
</head>
<body>
<div class="page-frame"></div>
<div class="wrap">
  <div id="home">
    <div class="topbar">
      <a class="brandmark" href="#/" id="brandmark"></a>
      <div class="topbar-right">
        <a class="ig-link" id="igTop" href="#" target="_blank" rel="noopener">Instagram &#8599;</a>
        <a class="cart-link" href="#/cart">Cart<span class="cart-count" id="cartCount">0</span></a>
      </div>
    </div>
    <section class="hero">
      <div class="hero-logo" id="heroLogo"></div>
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p class="lede" id="heroLede"></p>
      <div class="hero-meta" id="heroMeta"></div>
    </section>
    <nav class="cat-nav" id="catNav"></nav>
    <div id="homeCats"><div class="state">Loading…</div></div>
    <section class="studio">
      <h2 id="studioTitle"></h2>
      <div id="studioBody"></div>
    </section>
  </div>

  <div id="category">
    <nav class="crumb">
      <a href="#/">Home</a><span class="sep">/</span><span class="here" id="catCrumb"></span>
    </nav>
    <div class="cat-head-wrap">
      <div>
        <h1 class="cat-title" id="catTitle"></h1>
        <p class="cat-sub" id="catSub" style="padding-bottom:0"></p>
      </div>
      <span class="cat-count" id="catCount"></span>
    </div>
    <div class="grid full" id="catGrid"></div>
    <div class="sibling">
      <div class="sibling-label">Browse other pieces</div>
      <div class="sibling-row" id="catSiblings"></div>
    </div>
  </div>

  <div id="detail">
    <nav class="crumb">
      <a href="#/">Home</a><span class="sep">/</span>
      <a id="detailCrumbCat" href="#/">Category</a><span class="sep">/</span>
      <span class="here" id="detailCrumbName"></span>
    </nav>
    <div class="detail-grid" style="padding-top:24px">
      <div class="detail-media" id="detailMedia"></div>
      <div class="detail-info">
        <p class="eyebrow" id="detailCat"></p>
        <p class="detail-tag" id="detailTag"></p>
        <p class="detail-name" id="detailName"></p>
        <p class="detail-spec" id="detailSpec"></p>
        <div class="detail-rule"></div>
        <p class="detail-desc" id="detailDesc"></p>
        <p class="detail-price" id="detailPrice"></p>
        <div id="detailBuy"></div>
        <a class="ask-link" id="detailAsk" href="#" target="_blank" rel="noopener">Have a question? Ask on Instagram</a>
      </div>
    </div>
  </div>

  <div id="cart">
    <a class="back" href="#/">&larr; Continue shopping</a>
    <h1 class="page-h">Your cart</h1>
    <div id="cartBody"></div>
  </div>

  <div id="checkout">
    <a class="back" href="#/cart">&larr; Back to cart</a>
    <h1 class="page-h">Checkout</h1>
    <div id="coSummary" class="summary"></div>

    <div class="field"><label>Your name</label><input id="coName" placeholder="Full name" /></div>
    <div class="field"><label>Instagram handle or phone</label><input id="coContact" placeholder="@yourhandle or 03xx-xxxxxxx" /></div>
    <div class="field"><label>Delivery address</label><textarea id="coAddress" placeholder="House / street / city"></textarea></div>
    <div class="field"><label>Delivery city</label><select id="coShipping"></select></div>

    <div class="paybox" id="coPaybox"></div>

    <div class="field"><label>Upload payment screenshot / receipt *</label><input type="file" id="coReceipt" accept="image/*" /></div>
    <div class="field"><label>Note (optional)</label><textarea id="coNote" placeholder="Anything I should know?"></textarea></div>

    <div id="coMsg" class="form-msg"></div>
    <button class="cta" id="coSubmit">Place order</button>
  </div>

  <div id="orderdone">
    <div class="checkmark">&#10022;</div>
    <h1 class="page-h" style="text-align:center">Thank you!</h1>
    <p class="empty" id="doneText"></p>
    <a class="cta" href="#/">Back to shop</a>
  </div>

  <footer><span id="footLeft"></span><span id="footRight"></span></footer>
</div>

<a class="cart-fab" id="cartFab" href="#/cart">
  <span class="fab-count" id="fabCount">0</span>
  <span>View cart</span>
  <span class="fab-total" id="fabTotal"></span>
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================  BRAND  ============================ */
const BRAND = {
  SUPABASE_URL:      "https://qpyvjbizbddczxbrojmp.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_HRY-vHeecirbaRUCiYyeOw_41KVgVYv",
  bucket:            "product-images",

  shopName:  "Whirly Co",
  instagram: "whirly_co",
  whatsapp:  "",

  /* ---- payment (edit these) ---- */
  currency:  "PKR",
  receiptsBucket: "payment-receipts",
  payment: {
    method:       "EasyPaisa",
    accountName:  "FILL IN \u2014 your EasyPaisa account name",
    accountNumber:"FILL IN \u2014 your EasyPaisa number",
    instructions: "Please transfer the total to the account above, then upload a screenshot of the transfer as proof of payment.",
  },
  shippingMethods: [
    { key:"islamabad", label:"Islamabad",    price:250 },
    { key:"other",     label:"Other cities", price:350 },
  ],
  // ▼ 여기 두 줄은 지금 쓰는 index.html의 값을 그대로 복붙하세요 (로고/QR base64) ▼
  logoUrl:   "",   // ← 기존 index.html의 logoUrl 값(data:image/png;base64,...) 붙여넣기
  qrUrl:     "",   // ← 기존 index.html의 qrUrl 값(data:image/png;base64,...) 붙여넣기

  eyebrow:   "Handmade in Islamabad \u00b7 made to order",
  title:     "Little symbols,\nworn like *wishes*.",
  lede:      "Handmade earrings & necklaces, each a tiny thing to carry \u2014 a star, the sea, a little light. Made to order, just for you.",
  meta:      ["Handmade to order", "Online payments", "Order by message"],

  studioTitle: "The studio",
  studioParas: [
    "Whirly Co is a one-person studio in Islamabad. Each piece is wound, beaded, and finished by hand \u2014 little wearable symbols, made one at a time.",
    "Because everything is made to order, no two come out exactly alike. Found one that feels like yours? Send a message and I'll make it.",
  ],
  shippingLine: "Made to order \u00b7 online payments \u00b7 ships once it's ready.",

  footerLeft:  "\u00a9 Whirly Co \u2014 handmade",
  footerRight: "A little studio \u00b7 made by hand in Islamabad",

  // 카테고리는 이제 관리자 페이지에서 관리합니다 (Supabase categories 테이블)
  theme: {},
};

/* ============================  ENGINE  =========================== */
const $=id=>document.getElementById(id);
const igUrl=()=>"https://instagram.com/"+BRAND.instagram;

const catByKey=k=>CATALOG.find(c=>c.key===k);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

function applyBranding(){
  for(const k in BRAND.theme){ if(BRAND.theme[k]) document.documentElement.style.setProperty("--"+k, BRAND.theme[k]); }
  $("pageTitle").textContent = BRAND.shopName;
  // logo replaces the wordmark entirely (no duplicate text)
  $("brandmark").innerHTML = BRAND.logoUrl
    ? '<img src="'+esc(BRAND.logoUrl)+'" alt="'+esc(BRAND.shopName)+'">'
    : "<span>"+esc(BRAND.shopName)+"</span>";
  $("heroLogo").innerHTML  = BRAND.logoUrl ? '<img src="'+esc(BRAND.logoUrl)+'" alt="'+esc(BRAND.shopName)+' logo">' : "";
  $("heroEyebrow").textContent = BRAND.eyebrow;
  $("heroTitle").innerHTML = esc(BRAND.title).replace(/\n/g,"<br>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  $("heroLede").textContent = BRAND.lede;
  $("heroMeta").innerHTML = (BRAND.meta||[]).map(t=>'<span><i class="star">&#10022;</i> '+esc(t)+'</span>').join("");
  $("studioTitle").textContent = BRAND.studioTitle;
  $("studioBody").innerHTML =
    (BRAND.studioParas||[]).map(p=>"<p>"+esc(p)+"</p>").join("") +
    (BRAND.shippingLine ? '<span class="shipping"><i class="star">&#10022;</i> '+esc(BRAND.shippingLine)+'</span>' : "") +
    (BRAND.qrUrl ? '<div class="qr-box"><img src="'+esc(BRAND.qrUrl)+'" alt="Instagram QR"><span>Scan to follow on Instagram</span></div>' : "");
  $("footLeft").textContent  = BRAND.footerLeft;
  $("footRight").textContent = BRAND.footerRight;
  $("igTop").href = igUrl();
}

const { createClient } = window.supabase;
const sb = createClient(BRAND.SUPABASE_URL, BRAND.SUPABASE_ANON_KEY);
let CATALOG = [];
let SETTINGS = {};

/* payment details live in the DB so the shop owner can edit them in admin */
async function loadSettings(){
  const { data, error } = await sb.from("shop_settings").select("key,value");
  if(error){ console.warn("settings:",error.message); return; }
  (data||[]).forEach(r=>{ SETTINGS[r.key]=r.value; });
  // logo/QR now live in the DB — no more pasting base64 into this file
  if(SETTINGS.brand_logo_url) BRAND.logoUrl = SETTINGS.brand_logo_url;
  if(SETTINGS.brand_qr_url)   BRAND.qrUrl   = SETTINGS.brand_qr_url;
  applyBranding();
}
function pay(field, fallback){
  const v = SETTINGS["payment_"+field];
  return (v!=null && v!=="") ? v : (fallback||"");
}

async function loadCatalog(){
  const cres = await sb.from("categories").select("*").order("sort_order").order("key");
  const pres = await sb.from("products").select("*").order("sort_order",{ascending:true}).order("id",{ascending:true});
  if(pres.error || cres.error){ console.error(pres.error||cres.error);
    $("homeCats").innerHTML='<div class="state">Couldn\'t load the collection. Please refresh in a moment.</div>'; return; }
  const cats = cres.data||[];
  const groups={}; (pres.data||[]).forEach(function(p){const k=(p.category_key||"others").trim();(groups[k]=groups[k]||[]).push(p);});
  CATALOG = cats.map(function(c){
    return { key:c.key, label:c.label, blurb:c.blurb||"", cover:c.cover_path||"", products:groups[c.key]||[] };
  });
  // any product whose category was removed still shows up
  Object.keys(groups).forEach(function(k){
    if(!CATALOG.find(function(c){return c.key===k;}))
      CATALOG.push({ key:k, label:k.charAt(0).toUpperCase()+k.slice(1), blurb:"", cover:"", products:groups[k] });
  });
  applyCategoryNav();
  renderHome(); route();
}
function applyCategoryNav(){
  $("catNav").innerHTML = CATALOG.map(function(c){
    return '<a class="cat-tile" href="#/c/'+esc(c.key)+'">'+esc(c.label)+'</a>';
  }).join("");
}

function orderUrlFor(p){
  const t="Hi "+BRAND.shopName+"! I'm interested in the \""+(p.tagline||p.name)+"\" \u2014 could you tell me the price and how to order?";
  return BRAND.whatsapp ? "https://wa.me/"+BRAND.whatsapp+"?text="+encodeURIComponent(t) : igUrl();
}
function mediaNode(p){
  const d=document.createElement("div"); const src=String(p.image_path||"").trim();
  if(src){ const img=document.createElement("img"); img.src=src; img.alt=p.tagline||p.name||""; img.loading="lazy";
    img.onerror=function(){d.innerHTML="";const ph=document.createElement("div");ph.className="ph";ph.textContent=((p.tagline||p.name||"?").charAt(0)).toUpperCase();d.appendChild(ph);};
    d.appendChild(img);
  }else{ const ph=document.createElement("div");ph.className="ph";ph.textContent=((p.tagline||p.name||"?").charAt(0)).toUpperCase();d.appendChild(ph); }
  return d;
}
const money=n=>(n==null||n==="")?"":BRAND.currency+" "+Number(n).toLocaleString();
function productCard(catKey,p,i){
  const a=document.createElement("a"); a.className="card"; a.href="#/p/"+catKey+"/"+i;
  const thumb=mediaNode(p); thumb.className="thumb";
  if(p.in_stock===false){
    thumb.classList.add("oos");
    const b=document.createElement("span"); b.className="oos-badge"; b.textContent="Out of stock";
    thumb.appendChild(b);
  }
  const tag=document.createElement("p"); tag.className="c-tag"; tag.textContent=p.tagline||p.name||"Untitled";
  const nm=document.createElement("p"); nm.className="c-name"; nm.textContent=p.name||"";
  a.append(thumb,tag,nm);
  if(p.price!=null&&p.price!==""){const pr=document.createElement("p");pr.className="c-price";pr.textContent=money(p.price);a.append(pr);}
  return a;
}
function renderHome(){
  const wrap=$("homeCats"); wrap.innerHTML="";
  if(!CATALOG.length){ wrap.innerHTML='<div class="state">No pieces yet \u2014 check back soon.</div>'; return; }
  const grid=document.createElement("div"); grid.className="cat-grid";
  CATALOG.forEach(function(cat){
    const a=document.createElement("a"); a.className="cat-card"; a.href="#/c/"+cat.key;
    const first=cat.products[0];
    const src=cat.cover || (first&&first.image_path) || "";
    const media=document.createElement("div"); media.className="cc-media";
    if(src){
      const img=document.createElement("img"); img.src=src; img.alt=cat.label; img.loading="lazy";
      img.onerror=function(){ media.innerHTML='<div class="cc-ph">'+cat.label.charAt(0)+'</div>'; };
      media.appendChild(img);
    }else{
      media.innerHTML='<div class="cc-ph">'+esc(cat.label.charAt(0))+'</div>';
    }
    const nm=document.createElement("div"); nm.className="cc-name"; nm.textContent=cat.label;
    a.append(media,nm); grid.appendChild(a);
  });
  wrap.appendChild(grid);
}
function renderCategory(key){
  const cat=catByKey(key); if(!cat){location.hash="#/";return;}
  $("catCrumb").textContent=cat.label;
  $("catTitle").textContent=cat.label;
  $("catSub").textContent=cat.blurb||"";
  $("catCount").textContent=cat.products.length+(cat.products.length===1?" piece":" pieces");
  const grid=$("catGrid"); grid.innerHTML="";
  cat.products.forEach(function(p,i){grid.appendChild(productCard(cat.key,p,i));});
  // sibling categories — keeps browsing flowing instead of bouncing to home
  $("catSiblings").innerHTML = CATALOG.filter(c=>c.key!==key)
    .map(c=>'<a href="#/c/'+esc(c.key)+'">'+esc(c.label)+'</a>').join("");
}
function renderDetail(key,idx){
  const cat=catByKey(key); if(!cat){location.hash="#/";return;}
  const p=cat.products[idx]; if(!p){location.hash="#/c/"+key;return;}
  $("detailCrumbCat").setAttribute("href","#/c/"+key);
  $("detailCrumbCat").textContent=cat.label;
  $("detailCrumbName").textContent=p.tagline||p.name||"";
  const media=mediaNode(p); media.id="detailMedia"; media.className="detail-media";
  $("detailMedia").replaceWith(media);
  $("detailCat").textContent=cat.label; $("detailTag").textContent=p.tagline||p.name||"";
  $("detailName").textContent=p.name||""; $("detailSpec").textContent=p.spec||""; $("detailDesc").textContent=p.description||"";
  $("detailPrice").textContent = money(p.price);
  $("detailAsk").href = orderUrlFor(p);

  const buy=$("detailBuy"); buy.innerHTML="";
  const hasPrice = p.price!=null && p.price!=="";
  if(p.in_stock===false){
    const d=document.createElement("button"); d.className="order disabled"; d.disabled=true;
    d.style.width="100%"; d.textContent="Out of stock";
    buy.appendChild(d);
  }else if(hasPrice){
    let qty=1;
    const row=document.createElement("div"); row.className="add-row";
    const step=document.createElement("div"); step.className="qty";
    step.innerHTML='<button aria-label="less">\u2212</button><span>1</span><button aria-label="more">+</button>';
    const btn=document.createElement("button"); btn.className="order"; btn.style.flex="1"; btn.textContent="Add to cart";
    const [minus,plus]=step.querySelectorAll("button"); const num=step.querySelector("span");
    minus.onclick=()=>{qty=Math.max(1,qty-1);num.textContent=qty;};
    plus.onclick=()=>{qty++;num.textContent=qty;};
    btn.onclick=()=>{ cartAdd(p,qty); btn.textContent="Added \u2713"; setTimeout(()=>btn.textContent="Add to cart",1200); };
    row.append(step,btn); buy.appendChild(row);
  }else{
    const a=document.createElement("a"); a.className="order"; a.href=orderUrlFor(p);
    a.target="_blank"; a.rel="noopener"; a.textContent=BRAND.whatsapp?"Ask on WhatsApp":"Ask on Instagram";
    buy.appendChild(a);
  }
}
function show(view){
  ["home","category","detail","cart","checkout","orderdone"].forEach(v=>{
    const el=$(v);
    if(v===view){ el.style.display="block"; el.classList.remove("view"); void el.offsetWidth; el.classList.add("view"); }
    else { el.style.display="none"; }
  });
}
function route(){
  const h=location.hash||"#/"; let m;
  if((m=h.match(/^#\/p\/([a-z0-9_]+)\/(\d+)$/))){renderDetail(m[1],+m[2]);show("detail");window.scrollTo(0,0);}
  else if((m=h.match(/^#\/c\/([a-z0-9_]+)$/))){renderCategory(m[1]);show("category");window.scrollTo(0,0);}
  else if(h==="#/cart"){renderCart();show("cart");window.scrollTo(0,0);}
  else if(h==="#/checkout"){renderCheckout();show("checkout");window.scrollTo(0,0);}
  else if(h==="#/order-done"){show("orderdone");window.scrollTo(0,0);}
  else{show("home");}
  updateCartCount();
}

/* ============================  CART  ============================ */
const CART_KEY="whirly_cart";
function cartLoad(){ try{return JSON.parse(localStorage.getItem(CART_KEY))||[];}catch(e){return [];} }
function cartSave(c){ localStorage.setItem(CART_KEY,JSON.stringify(c)); updateCartCount(); }
function cartCount(){ return cartLoad().reduce((n,i)=>n+i.qty,0); }
function updateCartCount(){
  const n=cartCount();
  const el=$("cartCount"); if(el) el.textContent=n;
  // floating button
  const fab=$("cartFab");
  if(fab){
    const h=location.hash||"#/";
    const onCartPages = (h==="#/cart"||h==="#/checkout"||h==="#/order-done");
    $("fabCount").textContent=n;
    $("fabTotal").textContent=money(cartSubtotal());
    fab.classList.toggle("show", n>0 && !onCartPages);
  }
}
function cartAdd(p,qty){
  const c=cartLoad(); const ex=c.find(i=>i.id===p.id);
  if(ex){ ex.qty+=qty; } else { c.push({id:p.id,tagline:p.tagline||p.name||"",name:p.name||"",price:Number(p.price),image_path:p.image_path||"",qty:qty}); }
  cartSave(c);
}
function cartSetQty(id,qty){ const c=cartLoad(); const it=c.find(i=>i.id===id); if(it){ it.qty=Math.max(1,qty); } cartSave(c); }
function cartRemove(id){ cartSave(cartLoad().filter(i=>i.id!==id)); }
function cartSubtotal(){ return cartLoad().reduce((s,i)=>s+(Number(i.price)||0)*i.qty,0); }
function shippingPrice(){ const m=(BRAND.shippingMethods||[])[selectedShippingIdx()]; return m?Number(m.price)||0:0; }
function selectedShippingIdx(){ const s=$("coShipping"); return s&&s.value!==""?Number(s.value):0; }

function renderCart(){
  const box=$("cartBody"); const c=cartLoad();
  if(!c.length){ box.innerHTML='<div class="empty">Your cart is empty.<br><br><a class="view-all" href="#/">Browse the collection \u2192</a></div>'; return; }
  let html="";
  c.forEach(it=>{
    const media = it.image_path
      ? '<img src="'+esc(it.image_path)+'" alt="">'
      : '<div class="ph">'+((it.tagline||"?").charAt(0).toUpperCase())+'</div>';
    html+='<div class="cart-row" data-id="'+it.id+'">'+media+
      '<div class="cart-info"><div class="t">'+esc(it.tagline)+'</div>'+
      '<div class="pr">'+esc(money(it.price))+' each</div>'+
      '<div class="qty" style="margin-top:8px"><button class="q-minus">\u2212</button><span>'+it.qty+'</span><button class="q-plus">+</button></div></div>'+
      '<button class="cart-remove">Remove</button></div>';
  });
  const sub=cartSubtotal();
  html+='<div class="summary"><div class="line"><span>Subtotal</span><span>'+esc(money(sub))+'</span></div></div>'+
        '<a class="cta" href="#/checkout">Checkout</a>';
  box.innerHTML=html;
  box.querySelectorAll(".cart-row").forEach(row=>{
    const id=Number(row.getAttribute("data-id"));
    row.querySelector(".q-minus").onclick=()=>{const it=cartLoad().find(i=>i.id===id);cartSetQty(id,(it?it.qty:1)-1);renderCart();};
    row.querySelector(".q-plus").onclick=()=>{const it=cartLoad().find(i=>i.id===id);cartSetQty(id,(it?it.qty:1)+1);renderCart();};
    row.querySelector(".cart-remove").onclick=()=>{cartRemove(id);renderCart();};
  });
}

/* ============================  CHECKOUT  ======================== */
function renderCheckout(){
  const c=cartLoad();
  if(!c.length){ location.hash="#/cart"; return; }
  // shipping options
  $("coShipping").innerHTML=(BRAND.shippingMethods||[]).map((m,i)=>
    '<option value="'+i+'">'+esc(m.label)+(m.price?(" \u2014 "+money(m.price)):" \u2014 free")+'</option>'
  ).join("");
  // payment box — values come from shop_settings (editable in admin)
  const method = pay("method", (BRAND.payment||{}).method || "Payment");
  const acctName = pay("account_name", "");
  const acctNum  = pay("account_number", "");
  const instr    = pay("instructions", (BRAND.payment||{}).instructions || "");
  $("coPaybox").innerHTML='<h3>'+esc(method)+'</h3>'+
    (acctName?'<div class="kv"><b>Account name:</b> '+esc(acctName)+'</div>':'')+
    (acctNum ?'<div class="kv"><b>'+esc(method)+' number:</b> '+esc(acctNum)+'</div>':'')+
    ((!acctName&&!acctNum)?'<div class="kv" style="color:#B33A50">Payment details are being set up — please message on Instagram to complete your order.</div>':'')+
    (instr?'<p>'+esc(instr)+'</p>':'');
  $("coShipping").onchange=renderSummary;
  renderSummary();
}
function renderSummary(){
  const c=cartLoad(); const sub=cartSubtotal(); const ship=shippingPrice(); const total=sub+ship;
  let lines=c.map(i=>'<div class="line"><span>'+esc(i.tagline)+' \u00d7 '+i.qty+'</span><span>'+esc(money((Number(i.price)||0)*i.qty))+'</span></div>').join("");
  lines+='<div class="line"><span>Shipping</span><span>'+(ship?esc(money(ship)):"Free")+'</span></div>';
  lines+='<div class="line total"><span>Total</span><span>'+esc(money(total))+'</span></div>';
  $("coSummary").innerHTML=lines;
}

async function uploadReceipt(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path="r_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+"."+ext;
  const { error } = await sb.storage.from(BRAND.receiptsBucket).upload(path,file,{upsert:false});
  if(error) throw error;
  return path;
}

$("coSubmit").addEventListener("click",async function(){
  const btn=this; const msg=$("coMsg"); msg.className="form-msg";
  const c=cartLoad(); if(!c.length){location.hash="#/cart";return;}
  const name=$("coName").value.trim();
  const contact=$("coContact").value.trim();
  const address=$("coAddress").value.trim();
  const receiptFile=$("coReceipt").files&&$("coReceipt").files[0];
  if(!name||!contact){ msg.textContent="Please add your name and contact."; msg.className="form-msg err"; window.scrollTo(0,document.body.scrollHeight); return; }
  if(!address){ msg.textContent="Please add a delivery address."; msg.className="form-msg err"; return; }
  if(!receiptFile){ msg.textContent="Please upload your payment screenshot."; msg.className="form-msg err"; return; }

  btn.disabled=true; btn.textContent="Uploading receipt…";
  try{
    const receiptPath=await uploadReceipt(receiptFile);
    const shipIdx=selectedShippingIdx();
    const shipMethod=(BRAND.shippingMethods||[])[shipIdx];
    const total=cartSubtotal()+shippingPrice();
    btn.textContent="Placing order…";
    const items=c.map(i=>({ product_id:i.id, product_name:i.tagline, unit_price:Number(i.price)||0, quantity:i.qty }));
    const { data:orderId, error:oErr } = await sb.rpc("place_order",{
      p_customer_name:name, p_customer_contact:contact, p_shipping_address:address,
      p_shipping_method: shipMethod?shipMethod.label:"",
      p_payment_method: pay("method",(BRAND.payment||{}).method||""),
      p_receipt_path:receiptPath, p_total_amount:total,
      p_note:$("coNote").value.trim(), p_items:items,
    });
    if(oErr) throw oErr;
    cartSave([]);
    $("doneText").innerHTML="Your order is in \u2014 I'll check your payment and confirm on Instagram soon.<br>Order #"+orderId;
    location.hash="#/order-done";
  }catch(e){
    console.error(e);
    msg.textContent="Something went wrong: "+(e.message||e); msg.className="form-msg err";
  }finally{
    btn.disabled=false; btn.textContent="Place order";
  }
});

applyBranding();
window.addEventListener("hashchange",route);
updateCartCount();
loadSettings();
loadCatalog();
</script>
</body>
</html>
