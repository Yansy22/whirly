<!DOCTYPE html>
<html lang="en">
<!--  ┌─────────────────────────────────────────────────────────────┐
      │  MINI-SHOP TEMPLATE · customer site (reads from Supabase)     │
      │  To reuse for a new client, edit ONLY the BRAND block below.  │
      │  Files in repo root: index.html (this) + admin.html          │
      └─────────────────────────────────────────────────────────────┘ -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light" />
<title id="pageTitle">Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme: light;
    --night:#E2DDDA; --surface:#EDE9E4; --moon:#1E1A18; --muted:#6E5F58;
    --line:#7A1A28; --aqua:#7A1A28; --aqua2:#9B2233; --silver:#8A7A72; --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--night);color:var(--moon);font-family:"Jost",system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  img{display:block}
  .wrap{max-width:1020px;margin:0 auto;padding:0 24px;position:relative}
  .eyebrow{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--aqua);font-weight:400}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 0 16px}
  .brandmark{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",serif;font-size:27px;letter-spacing:.02em;color:var(--moon);text-decoration:none;font-weight:500}
  .brandmark img{height:40px;width:auto;opacity:1}
  .ig-link{font-size:12px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 16px;text-decoration:none;transition:.2s}
  .ig-link:hover,.ig-link:focus-visible{color:var(--aqua);border-color:var(--aqua)}
  .hero{position:relative;padding:50px 0 42px;border-bottom:1px solid var(--line);text-align:center;overflow:hidden}
  .hero::before{content:"";position:absolute;top:-45%;left:50%;transform:translateX(-50%);width:620px;height:620px;border-radius:50%;background:radial-gradient(circle, rgba(122,26,40,.08), transparent 62%);pointer-events:none}
  .hero-logo{display:flex;justify-content:center;margin-bottom:18px}
  .hero-logo img{height:104px;width:auto;opacity:1}
  .hero .eyebrow{margin-bottom:22px;display:inline-block;position:relative}
  .hero h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(42px,9.5vw,78px);line-height:1.03;letter-spacing:.01em;margin-bottom:20px;position:relative}
  .hero h1 em{font-style:italic;color:var(--aqua2)}
  .hero .lede{max-width:44ch;margin:0 auto 28px;color:var(--muted);font-size:clamp(15px,3.8vw,17px);position:relative}
  .hero-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;position:relative}
  .hero-meta span{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
  .star{color:var(--aqua);font-size:11px}
  .cat-block{padding:40px 0 8px}
  .cat-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;gap:16px}
  .cat-head h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:32px;letter-spacing:.01em}
  .cat-blurb{color:var(--muted);font-size:14px;margin-bottom:20px}
  .view-all{font-size:12px;letter-spacing:.08em;color:var(--aqua);text-decoration:none;white-space:nowrap;border-bottom:1px solid transparent;transition:.2s}
  .view-all:hover,.view-all:focus-visible{border-color:var(--aqua)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 18px}
  @media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:28px 22px}}
  .grid.full{padding-bottom:24px}
  @media(min-width:760px){.grid.full{grid-template-columns:repeat(3,1fr);gap:32px 24px}}
  .card{display:flex;flex-direction:column;text-decoration:none;color:inherit;cursor:pointer}
  .card:focus-visible{outline:1px solid var(--aqua);outline-offset:6px;border-radius:4px}
  .thumb{position:relative;aspect-ratio:4/5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .3s, box-shadow .3s}
  .thumb img{width:100%;height:100%;object-fit:cover}
  @media(hover:hover){.card:hover .thumb{border-color:rgba(122,26,40,.4);box-shadow:0 0 26px -12px rgba(122,26,40,.3)}}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface);font-family:"Cormorant Garamond",serif;font-size:42px;color:var(--aqua)}
  .c-tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:var(--aqua2);margin:13px 0 2px;line-height:1.25}
  .c-name{font-family:"Jost",sans-serif;font-weight:300;font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
  #category,#detail{display:none}
  .back{display:inline-flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font-family:"Jost",sans-serif;font-weight:300;font-size:12px;letter-spacing:.08em;color:var(--muted);padding:26px 0 12px;transition:.2s;text-decoration:none}
  .back:hover,.back:focus-visible{color:var(--aqua)}
  .cat-title{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(30px,7vw,44px);padding:6px 0 4px}
  .cat-sub{color:var(--muted);font-size:14px;padding-bottom:24px}
  .detail-grid{display:grid;gap:32px;padding-bottom:80px}
  @media(min-width:800px){.detail-grid{grid-template-columns:1fr 1fr;gap:54px;align-items:start}}
  .detail-media{position:relative;aspect-ratio:4/5;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
  .detail-media img{width:100%;height:100%;object-fit:cover}
  .detail-info{padding-top:6px}
  .detail-info .eyebrow{margin-bottom:14px}
  .detail-tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;font-size:clamp(30px,6.5vw,46px);line-height:1.08;color:var(--moon);margin-bottom:6px}
  .detail-name{font-family:"Jost",sans-serif;font-weight:300;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .detail-spec{font-size:13px;letter-spacing:.03em;color:var(--muted);margin-bottom:22px}
  .detail-rule{height:1px;background:linear-gradient(90deg,var(--aqua),transparent);margin:20px 0 24px;opacity:.5}
  .detail-desc{color:#3A322E;white-space:pre-line;margin-bottom:34px;font-size:16px}
  .order{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--aqua);color:#F6EFE6;font-family:"Jost",sans-serif;font-weight:500;font-size:14px;letter-spacing:.04em;border:none;border-radius:999px;padding:17px 24px;cursor:pointer;text-decoration:none;transition:background .2s,transform .15s}
  .order:hover{background:var(--aqua2)} .order:active{transform:scale(.985)}
  .order-note{font-size:12px;letter-spacing:.03em;color:var(--muted);margin-top:14px;text-align:center}
  .studio{border-top:1px solid var(--line);margin-top:38px;padding:44px 0 8px;display:grid;gap:24px}
  @media(min-width:720px){.studio{grid-template-columns:200px 1fr;gap:50px}}
  .studio h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:27px}
  .studio p{color:#4A403B;max-width:60ch;margin-bottom:14px}
  .shipping{font-size:12px;letter-spacing:.05em;color:var(--muted);display:inline-flex;align-items:center;gap:9px}
  .state{padding:60px 0;text-align:center;color:var(--muted);font-size:14px;letter-spacing:.04em}
  footer{border-top:1px solid var(--line);margin-top:42px;padding:28px 0 52px;font-size:12px;letter-spacing:.04em;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  /* outer frame line */
  .page-frame{position:fixed;inset:14px;border:1px solid var(--line);pointer-events:none;z-index:1}
  @media(max-width:640px){.page-frame{inset:8px}}

  /* category navigation tiles (front page) */
  .cat-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:34px 0 6px;border-bottom:1px solid var(--line)}
  .cat-tile{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;letter-spacing:.03em;color:var(--aqua2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 22px;transition:.2s;background:rgba(122,26,40,.04)}
  .cat-tile:hover,.cat-tile:focus-visible{border-color:var(--aqua);color:var(--moon);background:rgba(122,26,40,.09)}

  /* Instagram QR (in studio section) */
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
  .qr-box img{width:130px;height:130px;border-radius:10px;background:#fff;padding:8px}
  .qr-box span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="page-frame"></div>
<div class="wrap">
  <div id="home">
    <div class="topbar">
      <a class="brandmark" href="#/" id="brandmark"></a>
      <a class="ig-link" id="igTop" href="#" target="_blank" rel="noopener">Instagram &#8599;</a>
    </div>
    <section class="hero">
      <div class="hero-logo" id="heroLogo"></div>
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p class="lede" id="heroLede"></p>
      <div class="hero-meta" id="heroMeta"></div>
    </section>
    <nav class="cat-nav" id="catNav"></nav>
    <div id="homeCats"><div class="state">Loading…</div></div>
    <section class="studio">
      <h2 id="studioTitle"></h2>
      <div id="studioBody"></div>
    </section>
  </div>

  <div id="category">
    <a class="back" href="#/" id="catBack">&larr; Home</a>
    <h1 class="cat-title" id="catTitle"></h1>
    <p class="cat-sub" id="catSub"></p>
    <div class="grid full" id="catGrid"></div>
  </div>

  <div id="detail">
    <a class="back" id="detailBack">&larr; Back</a>
    <div class="detail-grid">
      <div class="detail-media" id="detailMedia"></div>
      <div class="detail-info">
        <p class="eyebrow" id="detailCat"></p>
        <p class="detail-tag" id="detailTag"></p>
        <p class="detail-name" id="detailName"></p>
        <p class="detail-spec" id="detailSpec"></p>
        <div class="detail-rule"></div>
        <p class="detail-desc" id="detailDesc"></p>
        <a class="order" id="orderBtn" href="#" target="_blank" rel="noopener"></a>
        <p class="order-note" id="orderNote"></p>
      </div>
    </div>
  </div>

  <footer><span id="footLeft"></span><span id="footRight"></span></footer>
</div>

const $=id=>document.getElementById(id);
const igUrl=()=>"https://instagram.com/"+BRAND.instagram;
const catMeta=k=>BRAND.categories.find(c=>c.key===k);
const catByKey=k=>CATALOG.find(c=>c.key===k);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

function applyBranding(){
  for(const k in BRAND.theme){ if(BRAND.theme[k]) document.documentElement.style.setProperty("--"+k, BRAND.theme[k]); }
  $("pageTitle").textContent = BRAND.shopName;
  const logo = BRAND.logoUrl ? '<img src="'+esc(BRAND.logoUrl)+'" alt="'+esc(BRAND.shopName)+'">' : "";
  $("brandmark").innerHTML = logo + "<span>"+esc(BRAND.shopName)+"</span>";
  $("heroLogo").innerHTML  = BRAND.logoUrl ? '<img src="'+esc(BRAND.logoUrl)+'" alt="'+esc(BRAND.shopName)+' logo">' : "";
  $("heroEyebrow").textContent = BRAND.eyebrow;
  $("heroTitle").innerHTML = esc(BRAND.title).replace(/\n/g,"<br>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  $("heroLede").textContent = BRAND.lede;
  $("heroMeta").innerHTML = (BRAND.meta||[]).map(t=>'<span><i class="star">&#10022;</i> '+esc(t)+'</span>').join("");
  $("studioTitle").textContent = BRAND.studioTitle;
  $("studioBody").innerHTML =
    (BRAND.studioParas||[]).map(p=>"<p>"+esc(p)+"</p>").join("") +
    (BRAND.shippingLine ? '<span class="shipping"><i class="star">&#10022;</i> '+esc(BRAND.shippingLine)+'</span>' : "") +
    (BRAND.qrUrl ? '<div class="qr-box"><img src="'+esc(BRAND.qrUrl)+'" alt="Instagram QR"><span>Scan to follow on Instagram</span></div>' : "");
  $("footLeft").textContent  = BRAND.footerLeft;
  $("footRight").textContent = BRAND.footerRight;
  $("igTop").href = igUrl();
  $("catNav").innerHTML = (BRAND.categories||[]).map(c=>
    '<a class="cat-tile" href="#/c/'+esc(c.key)+'">'+esc(c.label)+'</a>'
  ).join("");
}

const { createClient } = window.supabase;
const sb = createClient(BRAND.SUPABASE_URL, BRAND.SUPABASE_ANON_KEY);
let CATALOG = [];

async function loadCatalog(){
  const { data, error } = await sb.from("products").select("*")
    .order("sort_order",{ascending:true}).order("id",{ascending:true});
  if(error){ console.error(error);
    $("homeCats").innerHTML='<div class="state">Couldn\'t load the collection. Please refresh in a moment.</div>'; return; }
  const groups={}; (data||[]).forEach(p=>{const k=(p.category_key||"other").trim();(groups[k]=groups[k]||[]).push(p);});
  const ordered=BRAND.categories.map(c=>c.key).filter(k=>groups[k]);
  const extras=Object.keys(groups).filter(k=>!ordered.includes(k));
  CATALOG=[...ordered,...extras].map(k=>{
    const m=catMeta(k);
    return { key:k, label:(m&&m.label)||(k.charAt(0).toUpperCase()+k.slice(1)), blurb:(m&&m.blurb)||"", products:groups[k] };
  });
  renderHome(); route();
}

function orderUrlFor(p){
  const t="Hi "+BRAND.shopName+"! I'm interested in the \""+(p.tagline||p.name)+"\" \u2014 could you tell me the price and how to order?";
  return BRAND.whatsapp ? "https://wa.me/"+BRAND.whatsapp+"?text="+encodeURIComponent(t) : igUrl();
}
function mediaNode(p){
  const d=document.createElement("div"); const src=String(p.image_path||"").trim();
  if(src){ const img=document.createElement("img"); img.src=src; img.alt=p.tagline||p.name||""; img.loading="lazy";
    img.onerror=function(){d.innerHTML="";const ph=document.createElement("div");ph.className="ph";ph.textContent=((p.tagline||p.name||"?").charAt(0)).toUpperCase();d.appendChild(ph);};
    d.appendChild(img);
  }else{ const ph=document.createElement("div");ph.className="ph";ph.textContent=((p.tagline||p.name||"?").charAt(0)).toUpperCase();d.appendChild(ph); }
  return d;
}
function productCard(catKey,p,i){
  const a=document.createElement("a"); a.className="card"; a.href="#/p/"+catKey+"/"+i;
  const thumb=mediaNode(p); thumb.className="thumb";
  const tag=document.createElement("p"); tag.className="c-tag"; tag.textContent=p.tagline||p.name||"Untitled";
  const nm=document.createElement("p"); nm.className="c-name"; nm.textContent=p.name||"";
  a.append(thumb,tag,nm); return a;
}
function renderHome(){
  const wrap=$("homeCats"); wrap.innerHTML="";
  if(!CATALOG.length){ wrap.innerHTML='<div class="state">No pieces yet \u2014 check back soon.</div>'; return; }
  CATALOG.forEach(function(cat){
    const block=document.createElement("section"); block.className="cat-block";
    const head=document.createElement("div"); head.className="cat-head";
    const h2=document.createElement("h2"); h2.textContent=cat.label;
    const va=document.createElement("a"); va.className="view-all"; va.href="#/c/"+cat.key; va.textContent="View all "+cat.products.length+" \u2192";
    head.append(h2,va);
    const blurb=document.createElement("p"); blurb.className="cat-blurb"; blurb.textContent=cat.blurb||"";
    const grid=document.createElement("div"); grid.className="grid";
    cat.products.slice(0,BRAND.samplesOnHome).forEach(function(p,i){grid.appendChild(productCard(cat.key,p,i));});
    block.append(head,blurb,grid); wrap.appendChild(block);
  });
}
function renderCategory(key){
  const cat=catByKey(key); if(!cat){location.hash="#/";return;}
  $("catTitle").textContent=cat.label; $("catSub").textContent=cat.blurb||"";
  const grid=$("catGrid"); grid.innerHTML="";
  cat.products.forEach(function(p,i){grid.appendChild(productCard(cat.key,p,i));});
}
function renderDetail(key,idx){
  const cat=catByKey(key); if(!cat){location.hash="#/";return;}
  const p=cat.products[idx]; if(!p){location.hash="#/c/"+key;return;}
  $("detailBack").setAttribute("href","#/c/"+key);
  $("detailBack").textContent="\u2190 Back to "+cat.label.toLowerCase();
  const media=mediaNode(p); media.id="detailMedia"; media.className="detail-media";
  $("detailMedia").replaceWith(media);
  $("detailCat").textContent=cat.label; $("detailTag").textContent=p.tagline||p.name||"";
  $("detailName").textContent=p.name||""; $("detailSpec").textContent=p.spec||""; $("detailDesc").textContent=p.description||"";
  const btn=$("orderBtn"); btn.textContent=BRAND.whatsapp?"Ask on WhatsApp":"Ask on Instagram"; btn.href=orderUrlFor(p);
  $("orderNote").textContent="Opens a message with this piece's name filled in \u2014 just ask about price & availability.";
}
function show(view){ $("home").style.display=view==="home"?"block":"none"; $("category").style.display=view==="category"?"block":"none"; $("detail").style.display=view==="detail"?"block":"none"; }
function route(){
  const h=location.hash||"#/"; let m;
  if((m=h.match(/^#\/p\/([a-z0-9_]+)\/(\d+)$/))){renderDetail(m[1],+m[2]);show("detail");window.scrollTo(0,0);}
  else if((m=h.match(/^#\/c\/([a-z0-9_]+)$/))){renderCategory(m[1]);show("category");window.scrollTo(0,0);}
  else{show("home");}
}

applyBranding();
window.addEventListener("hashchange",route);
loadCatalog();
</script>
</body>
</html>
